[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merra_modis_comparison"
version = "0.1.0"
description = "Daily MERRA-2 FRSNO versus STC-MODSCAG fractional snow-covered area evaluation over Colorado"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "earthaccess>=0.11",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
merra-modis-comparison = "merra_modis_comparison.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
