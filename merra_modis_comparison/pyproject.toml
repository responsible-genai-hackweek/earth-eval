[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merra-modis-comparison"
version = "0.1.0"
description = "Streaming daily reanalysis versus STC-MODSCAG snow-cover evaluation"
requires-python = ">=3.11"
dependencies = [
  "cdsapi>=0.7",
  "earthaccess>=0.15",
  "h5py>=3.10",
  "h5netcdf>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pydap>=3.5.5",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "requests>=2.31",
  "scipy>=1.11",
  "xarray>=2024.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
merra-modis-fsca = "merra_modis_comparison.cli:main"
merra-modis-spatial = "merra_modis_comparison.spatial_plotting:main"
merra-modis-composites = "merra_modis_comparison.composite_plotting:main"
merra-modis-reference-stats = "merra_modis_comparison.modis_fsca_stats:main"
merra-modis-bias-significance = "merra_modis_comparison.bias_significance:main"
merra-modis-wet-dry-bias-significance = "merra_modis_comparison.wet_dry_bias_significance:main"
merra-modis-regridding-diagnostic = "merra_modis_comparison.regridding_diagnostic:main"
reanalysis-modis-fsca = "merra_modis_comparison.reanalysis_cli:main"
reanalysis-modis-spatial = "merra_modis_comparison.reanalysis_spatial_plotting:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
